# ============================================================================
# PROJECT DEFAULTS REGISTRY
# ============================================================================
# Single source of truth for project-wide technical decisions.
# ALL commands, agents, and phases MUST read this file before generating
# specs, plans, or code. Deviations require explicit justification.
#
# Scaffolded + populated by /atomicspec.clarify (2026-07-19) after a
# subagent-supervised architecture interview. See changelog.md for the
# decision trail and _provenance below for how each field was decided.
# ============================================================================

version: 5
created: 2026-07-19
last_updated: 2026-07-19
last_updated_by: human
# ISO date when clarify last completed a full architectural-lurker pass.
interview_completed: 2026-07-19

# ============================================================================
# LIFECYCLE MARKERS (v0.3+)
# ============================================================================
lifecycle:
  stale_threshold_days: 7

# ============================================================================
# TARGET PLATFORM
# ============================================================================
target_platform:
  # web | mobile | desktop | both | library
  primary: web
  mobile_platforms: null
  mobile_framework: null
  desktop_framework: null

# ============================================================================
# MOBILE CONFIGURATION (not applicable — web only)
# ============================================================================
mobile:
  push_service: null
  offline_strategy: null
  local_database: null
  deep_linking: null
  iap_framework: null
  crash_reporting: null
  analytics: null
  cert_pinning: null
  biometric_auth: null
  app_architecture: null

# ============================================================================
# ARCHITECTURE
# ============================================================================
architecture:
  pattern: modular_monolith
  layers: null
  api_style: rest
  communication: async
  repo_structure: monorepo

# ============================================================================
# CODE PATTERNS
# ============================================================================
code_patterns:
  data_access: repository
  dependency_injection: container
  error_handling: exceptions
  async_pattern: async_await
  validation_approach: schema
  null_handling: strict_null

# ============================================================================
# API CONFIGURATION
# ============================================================================
api:
  versioning: url
  pagination: cursor
  error_format: rfc7807
  rate_limiting: token_bucket
  idempotency: required
  resource_naming: plural
  request_format: json
  auth_header: null
  response_envelope: null
  date_format: iso8601

# ============================================================================
# BACKEND CONFIGURATION
# ============================================================================
backend:
  language: typescript
  runtime_version: "node:22-lts"
  framework: nestjs
  orm: drizzle
  # DEVIATION from clarify default `session`; founder-approved 2026-07-19 during /atomicspec.plan.
  # Mitigations: short-lived access token + rotating httpOnly refresh token + server-side refresh denylist.
  auth_method: jwt
  auth_pattern: simple
  job_queue: bull
  cache: redis
  job_durability_semantics: at_least_once

# ============================================================================
# FRONTEND CONFIGURATION (Web)
# ============================================================================
frontend:
  framework: nextjs
  rendering: hybrid
  ui_library: mui
  styling: emotion
  state_management: zustand
  data_fetching: tanstack-query
  form_library: react-hook-form
  validation_library: zod
  routing: next-router
  i18n_posture: i18n_from_day_one

# ============================================================================
# NATIVE MOBILE SECTIONS (not applicable — web only)
# ============================================================================
ios:
  ui_framework: null
  min_version: null
  state_management: null
  navigation: null
  local_database: null
  networking: null
  async_pattern: null
android:
  ui_framework: null
  min_sdk: null
  target_sdk: null
  state_management: null
  navigation: null
  local_database: null
  dependency_injection: null
  networking: null
  async_pattern: null
react_native:
  dev_approach: null
  ui_library: null
  state_management: null
  navigation: null
  local_database: null
  type_checking: null
flutter:
  ui_approach: null
  min_version: null
  state_management: null
  navigation: null
  local_database: null
  networking: null
  code_generation: null

# ============================================================================
# DATABASE CONFIGURATION
# ============================================================================
database:
  type: postgresql
  tenancy_model: single_tenant
  soft_delete: true
  audit_columns: true
  migration_strategy: expand_contract
  connection_pooling: orm_default
  query_style: query_builder
  naming_tables: snake_case
  naming_columns: snake_case
  primary_key_type: ulid

# ============================================================================
# ERROR HANDLING & LOGGING
# ============================================================================
error_handling:
  logging_format: structured
  log_level: info
  error_tracking: null
  tracing: null
  correlation_header: null

# ============================================================================
# TESTING CONFIGURATION (deferred to /atomicspec.plan)
# ============================================================================
testing:
  unit_framework: vitest
  integration_framework: supertest
  e2e_framework: playwright
  coverage_target: 80
  test_organization: colocated
  mocking: msw

# ============================================================================
# INFRASTRUCTURE CONFIGURATION
# ============================================================================
# NOTE: cloud_provider enum has no Iran-domestic option. Object storage uses
# the S3 protocol against ArvanCloud (S3-compatible), NOT AWS S3. Compute is a
# self-managed / Iran-reachable VPS running Docker Compose. See changelog.
infrastructure:
  ci_cd: null            # deferred to cloud-move milestone (local-first v1)
  container: docker
  orchestration: docker-compose
  cloud_provider: null
  deployment_strategy: null
  iac: null
  secrets: env-files      # gitignored .env locally; secret manager on cloud move
  search: postgres_fts
  scheduling: app_scheduler
  file_storage: s3
  # v1 runs locally via Docker Compose; VPS/ArvanCloud production host deferred (cloud-later).
  deployment_target: containerized

# ============================================================================
# CONVENTIONS (deferred to /atomicspec.plan)
# ============================================================================
conventions:
  variables: camelCase
  files: kebab-case
  classes: PascalCase
  constants: SCREAMING_SNAKE_CASE
  commits: conventional
  branches: feat/xxx
  pr_titles: conventional

# ============================================================================
# UI/UX SPECIFICATIONS
# ============================================================================
ui_specs:
  dark_mode: false
  responsive: true
  tablet_support: null
  landscape_support: null
  accessibility: wcag-aa
  animations: css
  design_tokens: css-variables
  design_token_source: frontend/src/theme/
  icons: lucide
  notifications: null

# ============================================================================
# SECURITY CONFIGURATION
# ============================================================================
security:
  cors: strict
  csrf: token
  csp: strict
  rate_limit_scope: ip
  input_sanitization: strict
  password_policy: strong

# ============================================================================
# PAYMENT
# ============================================================================
# provider enum lacks an Iran-domestic option. v1 ships a Zarinpal MOCK behind
# a PaymentPort (port/adapter). provider=none keeps downstream enum branches
# honest; the real roadmap is carried as metadata below.
payment:
  provider: none
  provider_custom: zarinpal_mock_v1
  provider_planned: [zarinpal_live, stripe]
  abstraction_pattern: port_adapter
  billing_model: subscription
  event_persistence: ledger

# ============================================================================
# EMAIL
# ============================================================================
# Western transactional email APIs may geoblock Iran. v1 uses a generic SMTP
# relay (Iranian provider, own domain w/ SPF/DKIM/DMARC) behind a MailPort.
email:
  transactional_provider: smtp
  marketing_provider: none
  template_strategy: in_repo_react_email

# ============================================================================
# DOMAIN PRIMITIVES
# ============================================================================
domain:
  money_representation: integer_minor_units
  time_representation: utc_only
  identifier_exposure: opaque_uuid

# ============================================================================
# AI / LLM (custom section — not in base template)
# ============================================================================
# Founder decision: OpenAI models, orchestrated with LangChain + LangGraph
# (JS/TS packages), behind a single PlantAIProvider interface + AiGatewayService
# that owns the 70% confidence gate, retry, and credit debit/refund. Iran
# reachability is accepted by the founder as their responsibility.
ai:
  provider: openai
  orchestration: langchain_langgraph
  boundary: plant_ai_provider_interface

# ============================================================================
# INTEGRATIONS
# ============================================================================
integrations:
  webhook_ingress_contract:
    # For Zarinpal: "required" means NEVER grant credit off the redirect alone —
    # always re-verify server-to-server via the provider Verify API. Same field
    # governs real HMAC verification when Stripe is added.
    signature_verification: required
    replay_window: "900"
    idempotency: event_id_dedupe
  outbound_http_policy:
    timeout_seconds: 30
    retry: exponential_backoff
    max_retries: 3
    circuit_breaker: enabled

# ============================================================================
# COMPLIANCE
# ============================================================================
# Iran-only market, no EU users → out of GDPR scope. Mock payments, no
# cardholder data handled directly → out of PCI scope. (PRD §9, §13.9.)
compliance:
  gdpr: false
  pci: false
  hipaa: null
  coppa: null
  soc2: null
  data_residency: ir-only

# ============================================================================
# FEATURE TRACKING
# ============================================================================
applied_to:
  - feature: plant-id-care-app
    spec_path: specs/001-plant-id-care-app/spec.md
    applied_at: 2026-07-19


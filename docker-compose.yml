# Local development infrastructure for the Plant Identification & Care app.
# v1 runs entirely under Docker Compose. Application services (api, web) are
# added by later tasks; this file provides the backing services they depend on.
#
# Services:
#   postgres  - primary database (Drizzle ORM target)
#   redis     - cache + BullMQ broker
#   minio     - S3-compatible object storage (stands in for ArvanCloud in prod)
#   mailpit   - local SMTP catcher + web UI (stands in for the Iranian SMTP relay)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plant}
      POSTGRES_DB: ${POSTGRES_DB:-plant}
    ports:
      # Host 25432 → container 5432. Uncommon host port so this project can run
      # alongside other local projects (and a native Postgres on 5432) without clashing.
      - '25432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-plant}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Host 26379 → container 6379 (avoid clashing with other projects' Redis).
      - '26379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      # Host 29000/29001 → container 9000/9001 (API + console).
      - '29000:9000'
      - '29001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      # Host 28025 (web UI) / 21025 (SMTP) → container 8025 / 1025.
      - '28025:8025'
      - '21025:1025'

volumes:
  postgres_data:
  redis_data:
  minio_data:
